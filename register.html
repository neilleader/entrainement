<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Montserrat", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://i.redd.it/athzdwu7iepa1.jpg') no-repeat center center/cover fixed;
    }

    .wrapper {
      width: 450px;
      background: rgba(0,0,0,0.1);
      border: 2px solid rgba(255,255,255,.2);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      padding: 30px 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: black;
      font-size: 32px;
    }

    .input-box {
      position: relative;
      width: 100%;
      height: 50px;
      margin: 18px 0;
    }

    .input-box input {
      width: 100%;
      height: 100%;
      border: 2px solid rgba(255,255,255,.2);
      border-radius: 40px;
      background: transparent;
      outline: none;
      padding: 0 45px 0 20px;
      font-size: 15px;
      color: black;
    }

    .input-box input::placeholder {
      color: black;
    }

    .input-box i {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
    }

    .btn {
      width: 100%;
      height: 45px;
      border: none;
      border-radius: 40px;
      background: black;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover {
      background: #222;
    }

    .msg {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      font-weight: 600;
    }

    .login-link {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
    }

    .login-link a {
      text-decoration: none;
      color: black;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <h1>Créer un compte</h1>

    <div class="input-box">
      <input type="text" id="nom" placeholder="Nom">
      <i class='bx bxs-user'></i>
    </div>

    <div class="input-box">
      <input type="text" id="prenom" placeholder="Prénom">
      <i class='bx bxs-user'></i>
    </div>

    <div class="input-box">
      <input type="email" id="email" placeholder="Adresse email">
      <i class='bx bxs-envelope'></i>
    </div>

    <div class="input-box">
      <input type="date" id="naissance">
      <i class='bx bxs-calendar'></i>
    </div>

    <div class="input-box">
      <input type="text" id="pseudo" placeholder="Pseudo">
      <i class='bx bxs-id-card'></i>
    </div>

    <div class="input-box">
      <input type="password" id="password" placeholder="Mot de passe">
      <i class='bx bxs-lock-alt'></i>
    </div>

    <button class="btn" onclick="register()">S'inscrire</button>

    <p id="msg" class="msg"></p>

    <div class="login-link">
      <p>Déjà un compte ? <a href="index.html">Se connecter</a></p>
    </div>
  </div>

  <script>
    function register() {
      const nom = document.getElementById('nom').value.trim();
      const prenom = document.getElementById('prenom').value.trim();
      const email = document.getElementById('email').value.trim();
      const naissance = document.getElementById('naissance').value;
      const pseudo = document.getElementById('pseudo').value.trim();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');

      if (!nom || !prenom || !email || !naissance || !pseudo || !password) {
        msg.style.color = 'red';
        msg.textContent = 'Veuillez remplir tous les champs.';
        return;
      }

      let accounts = JSON.parse(localStorage.getItem('accounts') || '[]');

      const existe = accounts.find(a => a.email === email || a.pseudo === pseudo);
      if (existe) {
        msg.style.color = 'red';
        msg.textContent = 'Compte déjà existant.';
        return;
      }

      accounts.push({ nom, prenom, email, naissance, pseudo, password });
      localStorage.setItem('accounts', JSON.stringify(accounts));

      msg.style.color = 'green';
      msg.textContent = 'Compte créé avec succès !';

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1500);
    }
  </script>

</body>
</html>
